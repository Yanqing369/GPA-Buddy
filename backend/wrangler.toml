name = "autumn-fire-bc81"
main = "worker.js"
compatibility_date = "2024-01-01"

# 环境变量（部署时会用到）
[vars]
# 前端网站域名（登录成功后跳转回这个地址）
FRONTEND_URL = "https://www.gpa-buddy.com"

# 这些密钥需要在 Cloudflare Dashboard 或使用 wrangler secret put 设置
# DEEPSEEK_API_KEY = "your-api-key-here"
# MOODLE_API_TOKEN = "your-moodle-token-here"
# MOONSHOT_API_KEY = "your-moonshot-api-key-here"
# GOOGLE_CLIENT_ID = "your-google-client-id"
# TURNSTILE_SECRET_KEY = "your-turnstile-secret-key"

# Moodle 教务系统地址
MOODLE_BASE_URL = "https://moodle.gpa-buddy.com"

# ADK Agent 答疑（/api/ask 的 Agent Runtime 链路）
# 仅当前端传 useAdkAgent=true 且 ADK_ASK_RUNTIME_ID 已配置时生效，否则回退直连 Vertex
ADK_ASK_ENABLED = "true"
ADK_ASK_REGION = "us-west1"
# 部署 Agent Runtime 后用 wrangler secret put 设置：
# ADK_ASK_RUNTIME_ID = "projects/gpa-490510/locations/us-west1/reasoningEngines/<id>"

# ADK Agent 导学图谱（/api/tutor/generate 的 Agent Runtime 多智能体工作流链路）
# 仅当前端传 useAdkAgent=true 且 ADK_TUTOR_RUNTIME_ID 已配置时生效，否则回退现有 Worker 编排
ADK_TUTOR_ENABLED = "true"
ADK_TUTOR_REGION = "us-central1"
# ADK_TUTOR_RUNTIME_ID = "projects/gpa-490510/locations/us-west1/reasoningEngines/<id>"

# ADK Agent 出题/导题合并接口（/api/quiz/generate，gpa-buddy-quizgen-adk 工作流）
# 需 ADK_QUIZ_RUNTIME_ID 已配置才可用，否则该接口返回 503
ADK_QUIZ_ENABLED = "true"
ADK_QUIZ_REGION = "us-central1"
# 部署 Agent Runtime 后用 wrangler secret put 设置：
# ADK_QUIZ_RUNTIME_ID = "projects/gpa-490510/locations/us-central1/reasoningEngines/<id>"

# R2 存储空间（课程资料原始文件）
[[r2_buckets]]
binding = "MATERIALS_BUCKET"
bucket_name = "course-materials"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "EXAM_STATS"
id = "06a5a03d25e34f99b3e707188f735abf"

# D1 数据库绑定（用户系统、题库、余额）
[[d1_databases]]
binding = "DB"
database_name = "exam-buddy-db"
database_id = "1ec81241-2e3f-48e8-84b7-53103a947857"
preview_database_id = "1ec81241-2e3f-48e8-84b7-53103a947857"
