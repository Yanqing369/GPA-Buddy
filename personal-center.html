<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - GPA-Buddy</title>
    <link rel="icon" href="resources/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="js/bank-migration.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- document-converter.js 依赖（Office 文件浏览器端转 PDF，本地化避免 CDN 不可达） -->
    <script src="js/vendor/pdf-lib.min.js"></script>
    <script src="js/vendor/fontkit.umd.min.js"></script>
    <script src="js/vendor/mammoth.browser.min.js"></script>
    <script src="js/vendor/xlsx.full.min.js"></script>
    <script src="js/vendor/jszip.min.js"></script>
    <script src="js/vendor/pptxtojson.umd.js"></script>
    <script src="js/vendor/tiff.min.js"></script>
    <script src="document-converter.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --paper-bg: #FAF9F6;
            --card-bg: rgba(255, 255, 255, 0.72);
            --forest: #86efac;
            --forest-dark: #22c55e;
            --purple-soft: #e9d5ff;
            --blue-soft: #bfdbfe;
            --orange-soft: #fed7aa;
            --text-primary: #1c1c1e;
            --text-secondary: #6b7280;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        
        .glass-nav {
            background: linear-gradient(135deg, rgba(255,255,255,0.82) 0%, rgba(255,251,235,0.85) 50%, rgba(254,252,232,0.88) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02), inset 0 -1px 0 rgba(255, 255, 255, 0.5);
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 50%, rgba(250,249,246,0.85) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }
        
        .liquid-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(250,249,246,0.9) 100%);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.08),
                0 1px 4px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .liquid-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(252,251,248,0.95) 100%);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            transform: translateY(-2px);
        }
        
        .liquid-btn:active {
            transform: scale(0.98) translateY(0);
        }
        
        .liquid-btn-emerald {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9) 0%, rgba(5, 150, 105, 0.95) 100%);
            border: 1px solid rgba(52, 211, 153, 0.5);
            box-shadow: 
                0 4px 16px rgba(16, 185, 129, 0.3),
                0 1px 4px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(167, 243, 208, 0.5),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            color: white;
        }
        
        .liquid-btn-emerald:hover {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.95) 0%, rgba(16, 185, 129, 1) 100%);
            box-shadow: 
                0 8px 24px rgba(16, 185, 129, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(167, 243, 208, 0.6),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }
        
        .spring-hover {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .spring-hover:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
        }
        
        .course-item {
            transition: all 0.2s ease;
        }
        
        .course-item.active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
            color: #059669;
            border-left: 3px solid #10b981;
        }
        
        .course-item:not(.active):hover {
            background: rgba(0, 0, 0, 0.03);
        }
        
        .tab-btn {
            transition: all 0.2s ease;
        }
        
        .upload-zone {
            transition: all 0.2s ease;
        }
        
        .upload-zone:hover {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.05);
        }
        
        .upload-zone.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .modal-enter {
            animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.08);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-green-200 selection:text-green-900">

    <!-- 导航栏 -->
    <nav class="glass-nav sticky top-0 z-50 h-16">
        <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 cursor-pointer spring-hover">
                <div class="h-10 rounded-xl overflow-hidden flex-shrink-0 w-10 bg-white">
                    <img src="resources/logo.png" alt="logo" class="h-full w-full object-contain">
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-900">个人中心</span>
            </a>
            <a href="index.html" class="px-4 py-2 rounded-xl liquid-btn text-sm font-medium text-slate-700 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>返回首页</span>
            </a>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- 课程列表侧边栏 -->
            <div class="md:col-span-1">
                <div class="glass-card rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg text-slate-900">我的课程</h2>
                        <span id="courseCount" class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
                    </div>
                    <div id="courseList" class="space-y-1 max-h-[calc(100vh-280px)] overflow-y-auto pr-1">
                        <div class="text-slate-400 text-sm text-center py-8">暂无课程</div>
                    </div>
                    <button onclick="showAddCourseModal()" class="mt-4 w-full py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        添加课程
                    </button>
                </div>
            </div>

            <!-- 课程详情区域 -->
            <div class="md:col-span-3">
                <div id="emptyState" class="glass-card rounded-2xl p-12 text-center">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-emerald-50 flex items-center justify-center">
                        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-900 mb-2">管理你的课程资料与题目</h3>
                    <p class="text-slate-500 mb-6">从左侧选择课程，或添加新课程开始整理</p>
                    <button onclick="showAddCourseModal()" class="px-6 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium">添加第一门课程</button>
                </div>

                <div id="courseDetail" class="hidden glass-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 id="currentCourseName" class="text-2xl font-bold text-slate-900"></h2>
                            <p class="text-sm text-slate-500 mt-1">管理该课程的资料与题目</p>
                        </div>
                        <button onclick="deleteCurrentCourse()" class="px-3 py-2 rounded-xl text-red-600 hover:bg-red-50 text-sm font-medium flex items-center gap-2 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            删除课程
                        </button>
                    </div>

                    <!-- 标签页 -->
                    <div class="flex gap-6 border-b border-gray-100 mb-6">
                        <button onclick="switchTab('materials')" id="tab-materials" class="tab-btn pb-3 border-b-2 border-emerald-500 font-semibold text-emerald-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            课程资料
                            <span id="materialCountBadge" class="text-xs px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
                        </button>
                        <button onclick="switchTab('questions')" id="tab-questions" class="tab-btn pb-3 border-b-2 border-transparent font-medium text-slate-500 hover:text-slate-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            我的题目
                            <span id="questionCountBadge" class="text-xs px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">0</span>
                        </button>
                    </div>

                    <!-- 课程资料 -->
                    <div id="materialsSection">
                        <div id="uploadZone" class="upload-zone border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center cursor-pointer">
                            <input type="file" id="materialUpload" class="hidden" multiple onchange="handleMaterialUpload(event)">
                            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-emerald-50 flex items-center justify-center">
                                <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                </svg>
                            </div>
                            <p class="text-slate-700 font-medium">点击或拖拽上传资料</p>
                            <p class="text-slate-400 text-sm mt-1">支持 PDF、Word、PPT、Excel、TXT 等常用格式（Office 文件将自动转为 PDF）</p>
                        </div>

                        <!-- 批量生成题库工具栏 -->
                        <div id="batchGenerateToolbar" class="hidden mt-6 flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="selectAllMaterials" onchange="toggleSelectAllMaterials()" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                                <label for="selectAllMaterials" class="text-sm font-medium text-slate-700">全选</label>
                            </div>
                            <span id="selectedMaterialCount" class="text-xs px-2 py-1 rounded-full bg-white text-slate-600">已选 0 个</span>
                            <button data-generate-btn onclick="openGenerateBankModal()" class="ml-auto px-4 py-2 rounded-xl liquid-btn-emerald text-sm font-medium flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                批量生成题库
                            </button>
                        </div>

                        <!-- 生成进度区域 -->
                        <div id="generateProgressArea" class="hidden mt-6 space-y-3"></div>

                        <div id="materialList" class="mt-6 space-y-3"></div>

                        <!-- 人机验证区域（生成题库需要） -->
                        <div id="parseSection" class="mt-6 pt-6 border-t border-slate-200">
                            <div id="turnstileWidget" class="cf-turnstile mb-4"></div>
                        </div>
                    </div>

                    <!-- 我的题目 -->
                    <div id="questionsSection" class="hidden">
                        <div class="mb-4 p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-sm text-slate-600">
                            这里展示你从课程资料生成的题库。点击题库即可使用 practice.html 原界面练习。
                        </div>
                        <div id="questionList" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加课程模态框 -->
    <div id="addCourseModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md modal-enter">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加课程</h3>
            <input type="text" id="courseNameInput" placeholder="例如：高等数学" 
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm"
                   onkeypress="if(event.key==='Enter')addCourse()">
            <button onclick="importFromAcademicSystem()" class="w-full mt-4 py-2.5 rounded-xl border border-dashed border-amber-300 bg-amber-50/50 text-amber-700 hover:bg-amber-50 text-sm font-medium flex items-center justify-center gap-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                从教务系统导入
            </button>
            <div class="flex gap-3 mt-6">
                <button onclick="hideAddCourseModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700">取消</button>
                <button onclick="addCourse()" class="flex-1 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 从教务系统导入结果模态框 -->
    <div id="moodleImportModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-lg modal-enter flex flex-col max-h-[80vh]">
            <h3 class="text-lg font-bold text-slate-900 mb-4">教务系统课程列表</h3>
            <div id="moodleCourseList" class="overflow-y-auto flex-1 min-h-0 pr-1">
                <div class="text-center py-8 text-slate-400 text-sm">正在读取...</div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideMoodleImportModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700">关闭</button>
            </div>
        </div>
    </div>

    <!-- 添加题目模态框 -->
    <div id="addQuestionModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-lg modal-enter">
            <h3 class="text-lg font-bold text-slate-900 mb-4">添加题目</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">题目标题</label>
                    <input type="text" id="questionTitleInput" placeholder="简要描述题目" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">题目内容</label>
                    <textarea id="questionContentInput" rows="3" placeholder="输入题目内容或题干"
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">答案 / 解析</label>
                    <textarea id="questionAnswerInput" rows="3" placeholder="输入答案或解析"
                              class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm resize-none"></textarea>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideAddQuestionModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700">取消</button>
                <button onclick="addQuestion()" class="flex-1 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium">保存题目</button>
            </div>
        </div>
    </div>

    <!-- 生成题库模态框 -->
    <div id="generateBankModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md modal-enter">
            <h3 id="generateBankModalTitle" class="text-lg font-bold text-slate-900 mb-4">生成题库</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">每份文件出题数量</label>
                    <input type="number" id="generateBankQuestionCount" value="20" min="1" max="200"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5">题目语言</label>
                    <select id="generateBankLang" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                        <option value="zh">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                        <option value="en">English</option>
                        <option value="ko">한국어</option>
                    </select>
                </div>
                <div class="text-xs text-slate-500 bg-slate-50 rounded-lg p-3">
                    <p>将基于选中的资料各生成一个题库，生成结果先保存到本地，并同步到云端以便跨设备使用。</p>
                    <p class="mt-1">生成过程可能耗时，请保持页面打开。</p>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideGenerateBankModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700">取消</button>
                <button id="generateBankConfirmBtn" data-generate-btn onclick="confirmGenerateBanks()" class="flex-1 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium">开始生成</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 translate-y-20 opacity-0 transition-all duration-300">
        <div class="bg-emerald-50 text-emerald-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-emerald-200">
            <svg id="toastIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span id="toastMessage">操作成功</span>
        </div>
    </div>

    <script>
        const isLocal = !location.hostname || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
        const API_BASE = isLocal
            ? 'http://localhost:8787'
            : 'https://moyuxiaowu.org';
        const TURNSTILE_SITE_KEY = isLocal
            ? '1x00000000000000000000AA'  // Turnstile test key (always passes)
            : '0x4AAAAAACyCQq1B6IXFL27N'; // Production key


        let data = { courses: [], materials: [], questions: [], batches: [] };
        let currentCourseId = null;
        let currentTab = 'materials';
        let isGenerating = false;
        let selectedMaterialIds = new Set();
        let generateBankSingleId = null; // 单文件生成时记录 id

        // 本地 IndexedDB：与 practice.html / manage.html 共用同一数据库
        const DB_NAME = 'ExamBuddyDB_Clean_v2';
        const db = new Dexie(DB_NAME);
        db.version(8).stores({
            questionBanks: '++id, name, createdAt, updatedAt',
            practiceProgress: '++id, bankId, lastPracticeAt',
            sourceFiles: '++id, name, fileName, markerFileName, bankId, graphId, data, createdAt, [graphId+name]',
            settings: 'key',
            knowledgeGraphs: '++id, name, createdAt, updatedAt',
            graphNodes: '++id, graphId, nodeId, [graphId+nodeId]',
            graphProgress: '++id, graphId, nodeId, [graphId+nodeId]'
        }).upgrade(tx => {
            return tx.table('sourceFiles').toCollection().modify(file => {
                if (!file.graphId) file.graphId = null;
            });
        });

        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }

        function apiFetch(path, options = {}) {
            const token = getAuthToken();
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            return fetch(`${API_BASE}${path}`, options);
        }

        function renderTurnstile(retryCount = 0) {
            const widget = document.getElementById('turnstileWidget');
            if (!widget) return;
            if (typeof turnstile === 'undefined') {
                if (retryCount < 10) {
                    setTimeout(() => renderTurnstile(retryCount + 1), 500);
                } else {
                    console.warn('[Turnstile] API failed to load');
                }
                return;
            }
            widget.innerHTML = '';
            turnstile.render(widget, {
                sitekey: TURNSTILE_SITE_KEY,
                theme: 'light',
                callback: (token) => console.log('[Turnstile] verified')
            });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleDateString('zh-CN', {
                year: 'numeric', month: 'short', day: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 从流式累积的文本中统计已完整解析的题目数（与 DocGenerate.js 的 extractCompleteObjects 同思路）
        function countCompleteQuestions(buffer) {
            const regex = /\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}/g;
            let match;
            let count = 0;
            while ((match = regex.exec(buffer)) !== null) {
                try {
                    const obj = JSON.parse(match[0]);
                    if (obj.question && obj.options && obj.correctAnswer) count++;
                } catch (e) {
                    // 不完整的对象，跳过
                }
            }
            return count;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');
            msg.textContent = message;
            if (type === 'error') {
                toast.querySelector('div').className = 'bg-red-50 text-red-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-red-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>';
            } else if (type === 'info') {
                toast.querySelector('div').className = 'bg-blue-50 text-blue-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-blue-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
            } else {
                toast.querySelector('div').className = 'bg-emerald-50 text-emerald-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-emerald-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>';
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function init() {
            // 打开本地数据库
            try { await db.open(); } catch (e) { console.warn('Open IndexedDB failed:', e); }

            if (!getAuthToken()) {
                showToast('请先登录以使用个人中心', 'error');
            } else {
                // 把 visitor 时代的本地零散题库迁移到云端 default 课程（幂等，后台执行）
                if (window.BankMigration) {
                    BankMigration.migrate({
                        apiBase: API_BASE,
                        onStatus: async (msg) => {
                            showToast(msg, 'success');
                            // 迁移可能新建了 default 课程和题库，刷新列表
                            await Promise.all([loadCourses(), loadCloudBanks()]);
                            if (pendingDefaultSelect) {
                                pendingDefaultSelect = !selectDefaultCourseIfExists();
                            }
                        }
                    });
                }
                await Promise.all([loadCourses(), loadCloudBanks()]);
                applyCourseParam();
            }
            setupDragDrop();
        }

        // 首页「开始练习」带 ?course=default 进来时，自动选中默认课程
        let pendingDefaultSelect = false;

        function selectDefaultCourseIfExists() {
            const storedId = parseInt(localStorage.getItem('default_course_id'));
            let course = storedId ? data.courses.find(c => c.id === String(storedId)) : null;
            if (!course) course = data.courses.find(c => /^default \d{6}$/.test(c.name));
            if (course) {
                selectCourse(course.id);
                return true;
            }
            return false;
        }

        function applyCourseParam() {
            const courseParam = new URLSearchParams(location.search).get('course');
            if (!courseParam) return;
            if (courseParam === 'default') {
                pendingDefaultSelect = !selectDefaultCourseIfExists();
            } else if (data.courses.some(c => c.id === courseParam)) {
                selectCourse(courseParam);
            }
        }

        async function loadCourses() {
            try {
                const res = await apiFetch('/api/courses');
                if (res.status === 401) {
                    showToast('登录已过期，请重新登录', 'error');
                    return;
                }
                if (!res.ok) throw new Error('Failed to load courses');
                const result = await res.json();
                data.courses = (result.courses || []).map(c => ({ ...c, id: String(c.id) }));
                data.materials = [];
                data.questions = [];
                currentCourseId = null;
                renderCourseList();
                renderCourseDetail();
            } catch (e) {
                console.error(e);
                showToast('加载课程失败', 'error');
            }
        }

        async function loadCourseDetail(courseId) {
            try {
                const res = await apiFetch(`/api/courses/${courseId}`);
                if (!res.ok) throw new Error('Failed to load course detail');
                const result = await res.json();
                data.materials = (result.materials || []).map(m => ({ ...m, id: String(m.id), course_id: String(m.course_id) }));
                data.questions = (result.questions || []).map(q => ({ ...q, id: String(q.id), course_id: String(q.course_id), batch_id: q.batch_id ? String(q.batch_id) : null }));
                data.batches = (result.batches || []).map(b => ({ ...b, id: String(b.id), course_id: String(b.course_id) }));
                renderCourseDetail();
            } catch (e) {
                console.error(e);
                showToast('加载课程详情失败', 'error');
            }
        }

        function updateCourseCount(courseId, type, delta) {
            const course = data.courses.find(c => c.id === courseId);
            if (!course) return;
            if (type === 'materials') {
                course.material_count = Math.max(0, (course.material_count || 0) + delta);
            } else if (type === 'questions') {
                course.question_count = Math.max(0, (course.question_count || 0) + delta);
            }
        }

        function renderCourseList() {
            const container = document.getElementById('courseList');
            document.getElementById('courseCount').textContent = data.courses.length;

            if (data.courses.length === 0) {
                container.innerHTML = '<div class="text-slate-400 text-sm text-center py-8">暂无课程，点击下方添加</div>';
                return;
            }

            container.innerHTML = data.courses.map(course => {
                const isActive = course.id === currentCourseId;
                const materialCount = course.material_count || 0;
                return `
                    <div onclick="selectCourse('${course.id}')" 
                         class="course-item cursor-pointer rounded-xl p-3 ${isActive ? 'active' : 'text-slate-700'}">
                        <div class="font-medium text-sm truncate">${escapeHtml(course.name)}</div>
                        <div class="text-xs mt-1 ${isActive ? 'text-emerald-600' : 'text-slate-400'}">
                            ${materialCount} 份资料
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectCourse(courseId) {
            currentCourseId = courseId;
            renderCourseList();
            await loadCourseDetail(courseId);
        }

        function renderCourseDetail() {
            const course = data.courses.find(c => c.id === currentCourseId);
            if (!course) {
                document.getElementById('courseDetail').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('courseDetail').classList.remove('hidden');
            document.getElementById('currentCourseName').textContent = course.name;

            updateCountBadges();
            if (currentTab === 'materials') {
                renderMaterials();
                renderTurnstile();
            } else {
                renderQuestions();
            }
        }

        // 只显示当前课程的云题库（course_id 为空的旧题库/手动上传题库不属于任何课程）
        function currentCourseBanks() {
            return cloudBanks.filter(b => String(b.course_id || '') === String(currentCourseId));
        }

        function updateCountBadges() {
            const materialCount = data.materials.filter(m => m.course_id === currentCourseId).length;
            document.getElementById('materialCountBadge').textContent = materialCount;
            document.getElementById('questionCountBadge').textContent = currentCourseBanks().length;
        }

        function showAddCourseModal() {
            document.getElementById('addCourseModal').classList.remove('hidden');
            document.getElementById('courseNameInput').value = '';
            setTimeout(() => document.getElementById('courseNameInput').focus(), 100);
        }

        function hideAddCourseModal() {
            document.getElementById('addCourseModal').classList.add('hidden');
        }

        async function addCourse() {
            const input = document.getElementById('courseNameInput');
            const name = input.value.trim();
            if (!name) {
                showToast('请输入课程名称', 'error');
                return;
            }
            try {
                const res = await apiFetch('/api/courses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (!res.ok) throw new Error('Failed to create course');
                const result = await res.json();
                result.course.id = String(result.course.id);
                result.course.material_count = 0;
                result.course.question_count = 0;
                data.courses.unshift(result.course);
                currentCourseId = result.course.id;
                data.materials = [];
                data.questions = [];
                renderCourseList();
                renderCourseDetail();
                hideAddCourseModal();
                showToast('课程添加成功');
            } catch (e) {
                console.error(e);
                showToast('添加课程失败', 'error');
            }
        }

        async function deleteCurrentCourse() {
            if (!currentCourseId) {
                showToast('请先选择课程', 'error');
                return;
            }
            const course = data.courses.find(c => c.id === currentCourseId);
            if (!course) return;
            if (!confirm(`确定要删除课程「${course.name}」吗？该课程下的所有资料和题目也将被删除。`)) return;

            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete course');
                data.courses = data.courses.filter(c => c.id !== currentCourseId);
                data.materials = data.materials.filter(m => m.course_id !== currentCourseId);
                data.questions = data.questions.filter(q => q.course_id !== currentCourseId);
                currentCourseId = null;
                renderCourseList();
                renderCourseDetail();
                showToast('课程已删除');
            } catch (e) {
                console.error(e);
                showToast('删除课程失败', 'error');
            }
        }

        async function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-materials').className = tab === 'materials' 
                ? 'tab-btn pb-3 border-b-2 border-emerald-500 font-semibold text-emerald-700 flex items-center gap-2'
                : 'tab-btn pb-3 border-b-2 border-transparent font-medium text-slate-500 hover:text-slate-700 flex items-center gap-2';
            document.getElementById('tab-questions').className = tab === 'questions'
                ? 'tab-btn pb-3 border-b-2 border-emerald-500 font-semibold text-emerald-700 flex items-center gap-2'
                : 'tab-btn pb-3 border-b-2 border-transparent font-medium text-slate-500 hover:text-slate-700 flex items-center gap-2';
            document.getElementById('materialsSection').classList.toggle('hidden', tab !== 'materials');
            document.getElementById('questionsSection').classList.toggle('hidden', tab !== 'questions');
            if (tab === 'materials') renderTurnstile();
            if (tab === 'questions') await loadCloudBanks();
            renderCourseDetail();
        }

        function setupDragDrop() {
            const zone = document.getElementById('uploadZone');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                zone.addEventListener(eventName, preventDefaults, false);
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                zone.addEventListener(eventName, () => zone.classList.add('dragover'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                zone.addEventListener(eventName, () => zone.classList.remove('dragover'), false);
            });
            zone.addEventListener('drop', handleDrop, false);
            zone.addEventListener('click', () => document.getElementById('materialUpload').click());
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function handleDrop(e) {
            const files = e.dataTransfer.files;
            if (files.length > 0) uploadFiles(files);
        }

        function handleMaterialUpload(e) {
            if (e.target.files.length > 0) uploadFiles(e.target.files);
            e.target.value = '';
        }

        // 可用 document-converter.js 浏览器端转 PDF 的 Office 格式
        const OFFICE_EXTS = ['docx', 'pptx', 'xlsx', 'xls'];
        let docConverter = null;

        function getDocConverter() {
            if (!docConverter) {
                docConverter = new DocumentConverter({
                    onProgress: (current, total, status) => console.log(`[Convert] ${current}/${total} - ${status}`)
                });
            }
            return docConverter;
        }

        async function convertOfficeToPdf(file) {
            const converter = getDocConverter();
            if (!converter.isFontLoaded) {
                showToast('正在加载转换字体...', 'info');
                await converter.loadFont();
            }
            if (!converter.isFontLoaded || !converter.fontBytes) {
                throw new Error('字体加载失败，无法转换中文内容');
            }
            const blob = await converter.convert(file, { download: false });
            const pdfFileName = file.name.replace(/\.[^/.]+$/, '.pdf');
            return new File([blob], pdfFileName, { type: 'application/pdf' });
        }

        async function uploadFiles(files) {
            if (!currentCourseId) {
                showToast('请先选择课程', 'error');
                return;
            }
            let successCount = 0;
            for (const file of Array.from(files)) {
                // Office 文件先在浏览器端转换为 PDF（与题库生成页同一套逻辑），再上传
                let uploadFile = file;
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                if (OFFICE_EXTS.includes(ext)) {
                    try {
                        showToast(`正在将 ${file.name} 转换为 PDF...`, 'info');
                        uploadFile = await convertOfficeToPdf(file);
                    } catch (e) {
                        console.error(e);
                        showToast(`转换 ${file.name} 失败：` + e.message, 'error');
                        continue;
                    }
                }
                const form = new FormData();
                form.append('file', uploadFile);
                form.append('name', uploadFile.name);
                try {
                    const res = await apiFetch(`/api/courses/${currentCourseId}/materials`, {
                        method: 'POST',
                        body: form
                    });
                    if (!res.ok) throw new Error('Failed to upload material');
                    const result = await res.json();
                    result.material.id = String(result.material.id);
                    result.material.course_id = String(result.material.course_id);
                    data.materials.push(result.material);
                    successCount++;
                } catch (e) {
                    console.error(e);
                    showToast(`上传 ${uploadFile.name} 失败`, 'error');
                }
            }
            updateCourseCount(currentCourseId, 'materials', successCount);
            updateCountBadges();
            if (currentTab === 'materials') renderMaterials();
            if (successCount > 0) showToast(`已上传 ${successCount} 个文件`);
        }

        function renderMaterials() {
            const container = document.getElementById('materialList');
            const materials = data.materials.filter(m => m.course_id === currentCourseId);
            const toolbar = document.getElementById('batchGenerateToolbar');

            // 显示/隐藏批量生成工具栏
            if (materials.length > 0) {
                toolbar.classList.remove('hidden');
            } else {
                toolbar.classList.add('hidden');
            }
            updateSelectedMaterialCount();

            if (materials.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">暂无资料，点击上方区域上传</div>';
                return;
            }

            const renderItem = (m) => {
                const isSelected = selectedMaterialIds.has(m.id);
                return `
                <div class="flex items-center justify-between p-4 rounded-xl bg-white/60 border border-white/80 hover:bg-white/90 transition-colors">
                    <div class="flex items-center gap-3 min-w-0">
                        <input type="checkbox" value="${m.id}" ${isSelected ? 'checked' : ''} onchange="toggleMaterialSelection('${m.id}')"
                               class="material-select w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 flex-shrink-0">
                        <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center flex-shrink-0">
                            <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                        </div>
                        <div class="min-w-0">
                            <div class="font-medium text-sm text-slate-900 truncate">${escapeHtml(m.name)}</div>
                            <div class="text-xs text-slate-500">
                                ${formatFileSize(m.size)} · ${formatDate(m.created_at)}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <button data-generate-btn onclick="openGenerateBankModal('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors">生成题库</button>
                        <button onclick="downloadMaterial('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors">下载</button>
                        <button onclick="deleteMaterial('${m.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium text-red-600 hover:bg-red-50 transition-colors">删除</button>
                    </div>
                </div>
            `;
            };

            container.innerHTML = `<div class="space-y-3">${materials.map(m => renderItem(m)).join('')}</div>`;
        }

        function toggleMaterialSelection(materialId) {
            if (selectedMaterialIds.has(materialId)) {
                selectedMaterialIds.delete(materialId);
            } else {
                selectedMaterialIds.add(materialId);
            }
            updateSelectedMaterialCount();
            updateSelectAllCheckbox();
        }

        function updateSelectAllCheckbox() {
            const materials = data.materials.filter(m => m.course_id === currentCourseId);
            const checkbox = document.getElementById('selectAllMaterials');
            if (materials.length === 0) {
                checkbox.checked = false;
                checkbox.indeterminate = false;
                return;
            }
            const allSelected = materials.every(m => selectedMaterialIds.has(m.id));
            const someSelected = materials.some(m => selectedMaterialIds.has(m.id));
            checkbox.checked = allSelected;
            checkbox.indeterminate = someSelected && !allSelected;
        }

        function toggleSelectAllMaterials() {
            const materials = data.materials.filter(m => m.course_id === currentCourseId);
            const checkbox = document.getElementById('selectAllMaterials');
            if (checkbox.checked) {
                materials.forEach(m => selectedMaterialIds.add(m.id));
            } else {
                materials.forEach(m => selectedMaterialIds.delete(m.id));
            }
            renderMaterials();
        }

        function updateSelectedMaterialCount() {
            const count = selectedMaterialIds.size;
            document.getElementById('selectedMaterialCount').textContent = `已选 ${count} 个`;
        }

        async function downloadMaterial(materialId) {
            if (!currentCourseId) {
                showToast('请先选择课程', 'error');
                return;
            }
            const material = data.materials.find(m => m.id === materialId);
            if (!material) return;
            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}/materials/${materialId}/download`, { method: 'GET' });
                if (!res.ok) throw new Error('Failed to download material');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = material.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                showToast('下载资料失败', 'error');
            }
        }

        async function deleteMaterial(materialId) {
            if (!currentCourseId) {
                showToast('请先选择课程', 'error');
                return;
            }
            if (!confirm('确定要删除这份资料吗？')) return;
            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}/materials/${materialId}`, { method: 'DELETE' });

        async function generateBanksForMaterials(materialIds, options) {
            if (isGenerating) return;
            isGenerating = true;
            setGenerateButtonsDisabled(true);

            const progressArea = document.getElementById('generateProgressArea');
            progressArea.classList.remove('hidden');
            progressArea.innerHTML = '<div class="text-sm text-slate-600 mb-2">正在生成题库...</div>';

            const progressMap = new Map(); // fileId -> { status, count, total }

            // 先把所有待生成文件放入进度区，未轮到的显示「正在排队...」
            for (const id of materialIds) {
                const material = data.materials.find(m => m.id === String(id));
                progressMap.set(String(id), { name: material?.name || String(id), status: '正在排队...', progress: 0, queued: true });
            }
            updateProgressUI();

            function updateProgressUI() {
                const items = Array.from(progressMap.values());
                if (items.length === 0) return;
                progressArea.innerHTML = items.map(item => `
                    <div class="p-3 rounded-xl bg-white/60 border border-white/80 text-sm">
                        <div class="flex items-center justify-between">
                            <span class="font-medium text-slate-700 truncate flex-1">${escapeHtml(item.name)}</span>
                            <span class="text-xs flex items-center gap-1.5 ${item.error ? 'text-red-500' : item.done ? 'text-emerald-600' : item.queued ? 'text-slate-400' : 'text-indigo-600'}">${item.parsing && !item.error && !item.done ? '<svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>' : ''}${item.status}</span>
                        </div>
                        ${!item.error && !item.done && !item.parsing && !item.queued ? `
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500 rounded-full transition-all" style="width: ${item.progress || 0}%"></div>
                        </div>` : ''}
                    </div>
                `).join('');
            }

            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}/generate-banks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        materialIds: materialIds.map(id => parseInt(id)),
                        questionCount: options.questionCount,
                        lang: options.lang,
                        turnstileToken: options.turnstileToken
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `请求失败 (${res.status})`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let allDoneReceived = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6).trim();
                        if (!payload || payload === '[DONE]') continue;
                        try {
                            const event = JSON.parse(payload);
                            const fileId = event.fileId ? String(event.fileId) : null;

                            if (fileId && !progressMap.has(fileId)) {
                                progressMap.set(fileId, { name: event.fileName || fileId, status: '等待中', progress: 0 });
                            }

                            if (event.type === 'file_start') {
                                const item = progressMap.get(fileId);
                                item.queued = false;
                                item.status = '正在解析文件';
                                item.parsing = true;
                            } else if (event.type === 'batch0_chunk') {
                                // 流式逐题更新进度（与 DocGenerate 一致）
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.chunkBuffer = (item.chunkBuffer || '') + (event.data || '');
                                const n = countCompleteQuestions(item.chunkBuffer);
                                if (n > (item.count || 0)) {
                                    item.count = n;
                                    item.status = `已生成 ${n} 题`;
                                    // 流式阶段最多走到 89%，之后由 final_result / file_done 推进
                                    item.progress = Math.max(item.progress || 0, Math.min(89, Math.round(n / options.questionCount * 100)));
                                }
                            } else if (event.type === 'batch0_done' || event.type === 'batch_done') {
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.count = Math.max(event.count || 0, item.count || 0);
                                item.status = `已生成 ${item.count} 题`;
                                item.progress = Math.max(item.progress || 0, 50);
                            } else if (event.type === 'final_result') {
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.count = event.generatedCount || event.data?.length || 0;
                                item.status = `共 ${item.count} 题`;
                                item.progress = Math.max(item.progress || 0, 90);
                            } else if (event.type === 'done') {
                                // 单个文件完成
                            } else if (event.type === 'file_done') {
                                const item = progressMap.get(fileId);
                                item.done = true;
                                item.status = '已保存';
                                item.progress = 100;
                                item.count = event.generatedCount || 0;

                                // 保存到本地并上传云端
                                await saveGeneratedBankToLocalAndCloud(event.fileId, event.fileName, event.questions, options.lang);
                            } else if (event.type === 'file_error') {
                                const item = progressMap.get(fileId);
                                item.error = true;
                                item.status = `失败：${event.message || '未知错误'}`;
                            } else if (event.type === 'all_done') {
                                allDoneReceived = true;
                            } else if (event.type === 'error') {
                                throw new Error(event.message || '生成失败');
                            }
                            updateProgressUI();
                        } catch (e) {
                            console.error('Parse SSE error:', e, line);
                        }
                    }
                }

                showToast(`题库生成完成，成功 ${Array.from(progressMap.values()).filter(i => i.done).length} 个`, 'success');
                selectedMaterialIds.clear();
                renderMaterials();
            } catch (e) {
                console.error(e);
                showToast('生成题库失败：' + e.message, 'error');
            } finally {
                isGenerating = false;
                setGenerateButtonsDisabled(false);
                if (typeof turnstile !== 'undefined') turnstile.reset();
                setTimeout(() => {
                    progressArea.classList.add('hidden');
                    progressArea.innerHTML = '';
                }, 3000);
            }
        }

        async function saveGeneratedBankToLocalAndCloud(materialId, materialName, questions, lang) {
            if (!Array.isArray(questions) || questions.length === 0) return;

            const bankName = `${materialName} 题库`;
            const bank = {
                name: bankName,
                questions: questions,
                favorites: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            // 1. 保存到本地 IndexedDB
            const localBankId = await db.questionBanks.add(bank);

            // 2. 下载源文件到本地 sourceFiles（如果 R2 有）
            const material = data.materials.find(m => m.id === String(materialId));
            if (material && material.r2_key) {
                try {
                    const res = await apiFetch(`/api/courses/${currentCourseId}/materials/${materialId}/download`);
                    if (res.ok) {
                        const blob = await res.blob();
                        await db.sourceFiles.add({
                            name: material.name,
                            fileName: material.name,
                            bankId: localBankId,
                            data: blob,
                            createdAt: new Date().toISOString()
                        });
                    }
                } catch (e) {
                    console.warn('Download source file to local failed:', e);
                }
            }

            // 3. 上传到云端 D1
            try {
                const res = await apiFetch('/api/cloud-banks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: bankName,
                        content: JSON.stringify(bank),
                        is_public: false,
                        course_id: currentCourseId,
                        source_r2_key: material?.r2_key || null,
                        source_name: material?.name || materialName,
                        source_type: material?.type || 'application/octet-stream',
                        source_size: material?.size || 0
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `请求失败 (${res.status})`);
                }
                // 回写云端 id，避免被 BankMigration 当成待迁移的本地题库重复上云
                const uploaded = await res.json().catch(() => null);
                if (uploaded?.bank?.id) {
                    await db.questionBanks.update(localBankId, { migratedCloudId: uploaded.bank.id });
                }
            } catch (e) {
                console.warn('Upload bank to cloud failed:', e);
                showToast(`「${bankName}」已保存到本地，但云端同步失败：${e.message}`, 'error');
            }
        }

        }

        async function practiceCloudBank(bankId) {
            try {
                // 1. 下载题库 JSON
                const res = await apiFetch(`/api/share/${bankId}/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: '' })
                });
                if (!res.ok) throw new Error('Failed to download bank');
                const data = await res.json();
                const bankData = JSON.parse(data.content);

                // 2. 写入本地 IndexedDB（标记 migratedCloudId，避免被 BankMigration 当成待迁移的本地题库重复上云）
                const localBankId = await db.questionBanks.add({
                    name: bankData.name || data.title || '题库',
                    questions: bankData.questions || [],
                    favorites: bankData.favorites || [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    migratedCloudId: bankId
                });

                // 3. 下载源文件到 sourceFiles
                const bankMeta = cloudBanks.find(b => b.id === bankId);
                if (bankMeta && bankMeta.has_source_file) {
                    try {
                        const sourceRes = await apiFetch(`/api/cloud-banks/${bankId}/source-file`);
                        if (sourceRes.ok) {
                            const blob = await sourceRes.blob();
                            await db.sourceFiles.add({
                                name: bankMeta.source_name || 'source',
                                fileName: bankMeta.source_name || 'source',
                                bankId: localBankId,
                                data: blob,
                                createdAt: new Date().toISOString()
                            });
                        }
                    } catch (e) {
                        console.warn('Download source file failed:', e);
                    }
                }

                // 4. 跳转 practice.html
                window.location.href = `practice.html?id=${localBankId}`;
            } catch (e) {
                console.error(e);
                showToast('加载题库失败：' + e.message, 'error');
            }
        }

            if (!confirm('确定要删除这个题库吗？本地已下载的副本不会被删除。')) return;
            try {
                const res = await apiFetch(`/api/cloud-banks/${bankId}`, { method: 'DELETE' });

        async function downloadCloudBankSource(bankId) {
            try {
                const bank = cloudBanks.find(b => b.id === bankId);
                const fileName = bank?.source_name || 'source';
                const res = await apiFetch(`/api/cloud-banks/${bankId}/source-file`);
                if (!res.ok) throw new Error('Failed to download source file');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                showToast('下载源文件失败', 'error');
            }
        }

                hideMoodleImportModal();
                hideAddCourseModal();
                showToast(`已导入课程「${result.course.name}」，共 ${result.materials.length} 个文件`);
            } catch (err) {
                container.innerHTML = `<div class="text-center py-8 text-red-500 text-sm">导入失败：${escapeHtml(err.message)}</div>`;
            }
        }

        document.getElementById('addCourseModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddCourseModal();
        });
        document.getElementById('addQuestionModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddQuestionModal();
        });
        document.getElementById('generateBankModal').addEventListener('click', function(e) {
            if (e.target === this) hideGenerateBankModal();
        });
        document.getElementById('moodleImportModal').addEventListener('click', function(e) {
            if (e.target === this) hideMoodleImportModal();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
