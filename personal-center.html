<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - GPA-Buddy</title>
    <link rel="icon" href="resources/logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script src="js/bank-migration.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- document-converter.js 依赖（Office 文件浏览器端转 PDF，本地化避免 CDN 不可达） -->
    <script src="js/vendor/pdf-lib.min.js"></script>
    <script src="js/vendor/fontkit.umd.min.js"></script>
    <script src="js/vendor/mammoth.browser.min.js"></script>
    <script src="js/vendor/xlsx.full.min.js"></script>
    <script src="js/vendor/jszip.min.js"></script>
    <script src="js/vendor/pptxtojson.umd.js"></script>
    <script src="js/vendor/tiff.min.js"></script>
    <script src="document-converter.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --paper-bg: #FAF9F6;
            --card-bg: rgba(255, 255, 255, 0.72);
            --forest: #86efac;
            --forest-dark: #22c55e;
            --purple-soft: #e9d5ff;
            --blue-soft: #bfdbfe;
            --orange-soft: #fed7aa;
            --text-primary: #1c1c1e;
            --text-secondary: #6b7280;
        }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f0fdf4 100%);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        
        .glass-nav {
            background: linear-gradient(135deg, rgba(255,255,255,0.82) 0%, rgba(255,251,235,0.85) 50%, rgba(254,252,232,0.88) 100%);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02), inset 0 -1px 0 rgba(255, 255, 255, 0.5);
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 50%, rgba(250,249,246,0.85) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                0 2px 8px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
        }
        
        .liquid-btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(250,249,246,0.9) 100%);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 
                0 4px 16px rgba(0, 0, 0, 0.08),
                0 1px 4px rgba(0, 0, 0, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .liquid-btn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(252,251,248,0.95) 100%);
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.12),
                0 2px 8px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
            transform: translateY(-2px);
        }
        
        .liquid-btn:active {
            transform: scale(0.98) translateY(0);
        }
        
        .liquid-btn-emerald {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.9) 0%, rgba(5, 150, 105, 0.95) 100%);
            border: 1px solid rgba(52, 211, 153, 0.5);
            box-shadow: 
                0 4px 16px rgba(16, 185, 129, 0.3),
                0 1px 4px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(167, 243, 208, 0.5),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            color: white;
        }
        
        .liquid-btn-emerald:hover {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.95) 0%, rgba(16, 185, 129, 1) 100%);
            box-shadow: 
                0 8px 24px rgba(16, 185, 129, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(167, 243, 208, 0.6),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }
        
        .spring-hover {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .spring-hover:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(0, 0, 0, 0.02);
        }
        
        .course-item {
            transition: all 0.2s ease;
        }
        
        .course-item.active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
            color: #059669;
            border-left: 3px solid #10b981;
        }
        
        .course-item:not(.active):hover {
            background: rgba(0, 0, 0, 0.03);
        }
        
        .tab-btn {
            transition: all 0.2s ease;
        }
        
        .upload-zone {
            transition: all 0.2s ease;
        }
        
        .upload-zone:hover {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.05);
        }
        
        .upload-zone.dragover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .modal-enter {
            animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes modalSlide {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.08);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-green-200 selection:text-green-900">

    <!-- 导航栏 -->
    <nav class="glass-nav sticky top-0 z-50 h-16">
        <div class="max-w-6xl mx-auto px-6 h-full flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 cursor-pointer spring-hover">
                <div class="h-10 rounded-xl overflow-hidden flex-shrink-0 w-10 bg-white">
                    <img src="resources/logo.png" alt="logo" class="h-full w-full object-contain">
                </div>
                <span class="font-bold text-lg tracking-tight text-slate-900" data-i18n="navTitle">个人中心</span>
            </a>
            <a href="index.html" class="px-4 py-2 rounded-xl liquid-btn text-sm font-medium text-slate-700 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span data-i18n="backHome">返回首页</span>
            </a>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="max-w-6xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <!-- 课程列表侧边栏 -->
            <div class="md:col-span-1">
                <div class="glass-card rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg text-slate-900" data-i18n="myCourses">我的课程</h2>
                        <span id="courseCount" class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
                    </div>
                    <div id="courseList" class="space-y-1 max-h-[calc(100vh-280px)] overflow-y-auto pr-1">
                        <div class="text-slate-400 text-sm text-center py-8" data-i18n="noCourses">暂无课程</div>
                    </div>
                    <button onclick="showAddCourseModal()" class="mt-4 w-full py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        <span data-i18n="addCourse">添加课程</span>
                    </button>
                </div>
            </div>

            <!-- 课程详情区域 -->
            <div class="md:col-span-3">
                <div id="emptyState" class="glass-card rounded-2xl p-12 text-center">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-emerald-50 flex items-center justify-center">
                        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-900 mb-2" data-i18n="emptyTitle">管理你的课程资料与题目</h3>
                    <p class="text-slate-500 mb-6" data-i18n="emptyDesc">从左侧选择课程，或添加新课程开始整理</p>
                    <button onclick="showAddCourseModal()" class="px-6 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium" data-i18n="addFirstCourse">添加第一门课程</button>
                </div>

                <div id="courseDetail" class="hidden glass-card rounded-2xl p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 id="currentCourseName" class="text-2xl font-bold text-slate-900"></h2>
                            <p class="text-sm text-slate-500 mt-1" data-i18n="courseDetailDesc">管理该课程的资料与题目</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div id="masteryBadge" class="hidden" title=""></div>
                            <button onclick="smartPractice()" class="px-4 py-2 rounded-xl liquid-btn-emerald text-white text-sm font-semibold flex items-center gap-2 spring-active shadow-lg shadow-emerald-200/50">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                                </svg>
                                <span data-i18n="smartPractice">智能练题</span>
                            </button>
                            <button onclick="deleteCurrentCourse()" class="px-3 py-2 rounded-xl text-red-600 hover:bg-red-50 text-sm font-medium flex items-center gap-2 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                                <span data-i18n="deleteCourse">删除课程</span>
                            </button>
                        </div>
                    </div>

                    <!-- 标签页 -->
                    <div class="flex gap-6 border-b border-gray-100 mb-6">
                        <button onclick="switchTab('materials')" id="tab-materials" class="tab-btn pb-3 border-b-2 border-emerald-500 font-semibold text-emerald-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <span data-i18n="tabMaterials">课程资料</span>
                            <span id="materialCountBadge" class="text-xs px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700">0</span>
                        </button>
                        <button onclick="switchTab('questions')" id="tab-questions" class="tab-btn pb-3 border-b-2 border-transparent font-medium text-slate-500 hover:text-slate-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span data-i18n="tabQuestions">我的题目</span>
                            <span id="questionCountBadge" class="text-xs px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600">0</span>
                        </button>
                        <button onclick="switchTab('tutor')" id="tab-tutor" class="tab-btn pb-3 border-b-2 border-transparent font-medium text-slate-500 hover:text-slate-700 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
                            </svg>
                            <span data-i18n="tabTutor">图谱导学</span>
                        </button>
                    </div>

                    <!-- 课程资料 -->
                    <div id="materialsSection">
                        <div id="uploadZone" class="upload-zone border-2 border-dashed border-slate-200 rounded-2xl p-8 text-center cursor-pointer">
                            <input type="file" id="materialUpload" class="hidden" multiple onchange="handleMaterialUpload(event)">
                            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-emerald-50 flex items-center justify-center">
                                <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                                </svg>
                            </div>
                            <p class="text-slate-700 font-medium" data-i18n="uploadHint">点击或拖拽上传资料</p>
                            <p class="text-slate-400 text-sm mt-1" data-i18n="uploadFormats">支持 PDF、Word、PPT、Excel、TXT 等常用格式（Office 文件将自动转为 PDF）</p>
                        </div>

                        <!-- 批量生成题库工具栏 -->
                        <div id="batchGenerateToolbar" class="hidden mt-6 flex flex-wrap items-center gap-3 p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100">
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="selectAllMaterials" onchange="toggleSelectAllMaterials()" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                                <label for="selectAllMaterials" class="text-sm font-medium text-slate-700" data-i18n="selectAll">全选</label>
                            </div>
                            <span id="selectedMaterialCount" class="text-xs px-2 py-1 rounded-full bg-white text-slate-600">已选 0 个</span>
                            <button data-generate-btn onclick="openGenerateBankModal()" class="ml-auto px-4 py-2 rounded-xl liquid-btn-emerald text-sm font-medium flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                <span data-i18n="batchGenerate">批量生成题库</span>
                            </button>
                        </div>

                        <!-- 生成进度区域 -->
                        <div id="generateProgressArea" class="hidden mt-6 space-y-3"></div>

                        <div id="materialList" class="mt-6 space-y-3"></div>

                        <!-- 人机验证区域（生成题库需要） -->
                        <div id="parseSection" class="mt-6 pt-6 border-t border-slate-200">
                            <div id="turnstileWidget" class="cf-turnstile mb-4"></div>
                        </div>
                    </div>

                    <!-- 我的题目 -->
                    <div id="questionsSection" class="hidden">
                        <div class="mb-4 p-4 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-sm text-slate-600" data-i18n="questionsHint">
                            这里展示你从课程资料生成的题库。点击题库即可使用 practice.html 原界面练习。
                        </div>
                        <div id="questionList" class="space-y-4"></div>
                    </div>

                    <!-- 图谱导学（iframe 嵌入 tutor.html，与功能文件夹中的图谱导学保持一致） -->
                    <div id="tutorSection" class="hidden">
                        <iframe id="tutorFrame" title="图谱导学" class="w-full border-0 rounded-2xl" style="height: calc(100vh - 220px); min-height: 600px;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加课程模态框 -->
    <div id="addCourseModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-md modal-enter">
            <h3 class="text-lg font-bold text-slate-900 mb-4" data-i18n="addCourse">添加课程</h3>
            <input type="text" id="courseNameInput" placeholder="例如：高等数学" data-i18n-placeholder="courseNamePlaceholder"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm"
                   onkeypress="if(event.key==='Enter')addCourse()">
            <button onclick="importFromAcademicSystem()" class="w-full mt-4 py-2.5 rounded-xl border border-dashed border-amber-300 bg-amber-50/50 text-amber-700 hover:bg-amber-50 text-sm font-medium flex items-center justify-center gap-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                <span data-i18n="importFromAcademic">从Moodle导入课程</span>
            </button>
            <div class="flex gap-3 mt-6">
                <button onclick="hideAddCourseModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700" data-i18n="cancel">取消</button>
                <button onclick="addCourse()" class="flex-1 py-2.5 rounded-xl liquid-btn-emerald text-sm font-medium" data-i18n="confirmAdd">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 从教务系统导入结果模态框 -->
    <div id="moodleImportModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-lg modal-enter flex flex-col max-h-[80vh]">
            <h3 class="text-lg font-bold text-slate-900 mb-4" data-i18n="moodleListTitle">教务系统课程列表</h3>
            <div id="moodleCourseList" class="overflow-y-auto flex-1 min-h-0 pr-1">
                <div class="text-center py-8 text-slate-400 text-sm" data-i18n="loading">正在读取...</div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideMoodleImportModal()" class="flex-1 py-2.5 rounded-xl liquid-btn text-sm font-medium text-slate-700" data-i18n="close">关闭</button>
            </div>
        </div>
    </div>

    <!-- 添加题目模态框 -->
    <div id="addQuestionModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="glass-card rounded-2xl p-6 w-full max-w-lg modal-enter">
            <h3 class="text-lg font-bold text-slate-900 mb-4" data-i18n="addQuestionTitle">添加题目</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="questionTitleLabel">题目标题</label>
                    <input type="text" id="questionTitleInput" placeholder="简要描述题目" data-i18n-placeholder="questionTitlePlaceholder" 
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1.5" data-i18n="questionContentLabel">题目内容</label>
                    <textarea id="questionContentInput" rows="3" placeholder="输入题目内容或题干" data-i18n-placeholder="questionContentPlaceholder"

        let currentLang = localStorage.getItem('language') || 'zh';
        if (!i18n[currentLang]) currentLang = 'zh';

        function t(key, ...args) {
            let text = i18n[currentLang]?.[key] || key;
            if (args.length > 0) {
                args.forEach((arg, index) => {
                    text = text.replace(`{${index}}`, arg);
                });
            }
            return text;
        }

        // 日期格式随语言切换（formatDateTimeCN 仍固定按 UTC+8 显示）
        function dateLocale() {
            return { 'zh': 'zh-CN', 'zh-TW': 'zh-TW', 'en': 'en-US', 'ko': 'ko-KR' }[currentLang] || 'zh-CN';
        }

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang]?.[key]) {
                    el.textContent = i18n[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (i18n[currentLang]?.[key]) {
                    el.placeholder = i18n[currentLang][key];
                }
            });

            const langMap = { 'zh': 'zh-CN', 'zh-TW': 'zh-TW', 'en': 'en', 'ko': 'ko' };
            document.documentElement.lang = langMap[currentLang] || 'zh-CN';
            document.title = t('pageTitle');
            // 图谱导学 iframe 的无障碍标题
            const tutorFrame = document.getElementById('tutorFrame');
            if (tutorFrame) tutorFrame.title = t('tabTutor');
        }

        let data = { courses: [], materials: [], questions: [], batches: [] };
        let currentCourseId = null;
        let currentTab = 'materials';
        let isGenerating = false;
        let selectedMaterialIds = new Set();
        let generateBankSingleId = null; // 单文件生成时记录 id

        // 本地 IndexedDB：与 practice.html / manage.html 共用同一数据库
        const DB_NAME = 'ExamBuddyDB_Clean_v2';
        const db = new Dexie(DB_NAME);
        db.version(8).stores({
            questionBanks: '++id, name, createdAt, updatedAt',
            practiceProgress: '++id, bankId, lastPracticeAt',
            sourceFiles: '++id, name, fileName, markerFileName, bankId, graphId, data, createdAt, [graphId+name]',
            settings: 'key',
            knowledgeGraphs: '++id, name, createdAt, updatedAt',
            graphNodes: '++id, graphId, nodeId, [graphId+nodeId]',
            graphProgress: '++id, graphId, nodeId, [graphId+nodeId]'
        }).upgrade(tx => {
            return tx.table('sourceFiles').toCollection().modify(file => {
                if (!file.graphId) file.graphId = null;
            });
        });

        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }

        function apiFetch(path, options = {}) {
            const token = getAuthToken();
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            return fetch(`${API_BASE}${path}`, options);
        }

        function renderTurnstile(retryCount = 0) {
            const widget = document.getElementById('turnstileWidget');
            if (!widget) return;
            if (typeof turnstile === 'undefined') {
                if (retryCount < 10) {
                    setTimeout(() => renderTurnstile(retryCount + 1), 500);
                } else {
                    console.warn('[Turnstile] API failed to load');
                }
                return;
            }
            widget.innerHTML = '';
            turnstile.render(widget, {
                sitekey: TURNSTILE_SITE_KEY,
                theme: 'light',
                callback: (token) => console.log('[Turnstile] verified')
            });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleDateString(dateLocale(), {
                year: 'numeric', month: 'short', day: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 从流式累积的文本中统计已完整解析的题目数（与 DocGenerate.js 的 extractCompleteObjects 同思路）
        function countCompleteQuestions(buffer) {
            const regex = /\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}/g;
            let match;
            let count = 0;
            while ((match = regex.exec(buffer)) !== null) {
                try {
                    const obj = JSON.parse(match[0]);
                    if (obj.question && obj.options && obj.correctAnswer) count++;
                } catch (e) {
                    // 不完整的对象，跳过
                }
            }
            return count;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');
            msg.textContent = message;
            if (type === 'error') {
                toast.querySelector('div').className = 'bg-red-50 text-red-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-red-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>';
            } else if (type === 'info') {
                toast.querySelector('div').className = 'bg-blue-50 text-blue-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-blue-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
            } else {
                toast.querySelector('div').className = 'bg-emerald-50 text-emerald-700 px-6 py-3 rounded-2xl shadow-lg flex items-center gap-3 text-sm font-medium border border-emerald-200';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>';
            }
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        async function init() {
            // 应用页面语言（静态 data-i18n 文案、<title>、<html lang>）
            updateLanguage();
            // 打开本地数据库
            try { await db.open(); } catch (e) { console.warn('Open IndexedDB failed:', e); }

            if (!getAuthToken()) {
                showToast(t('pleaseLogin'), 'error');
            } else {
                // 把 visitor 时代的本地零散题库迁移到云端 default 课程（幂等，后台执行）
                if (window.BankMigration) {
                    BankMigration.migrate({
                        apiBase: API_BASE,
                        onStatus: async (msg) => {
                            showToast(msg, 'success');
                            // 迁移可能新建了 default 课程和题库，刷新列表
                            await Promise.all([loadCourses(), loadCloudBanks()]);
                            if (pendingDefaultSelect) {
                                pendingDefaultSelect = !selectDefaultCourseIfExists();
                            }
                        }
                    });
                }
                await Promise.all([loadCourses(), loadCloudBanks()]);
                applyCourseParam();
            }
            setupDragDrop();
        }

        // 首页「开始练习」带 ?course=default 进来时，自动选中默认课程
        let pendingDefaultSelect = false;

        function selectDefaultCourseIfExists() {
            const storedId = parseInt(localStorage.getItem('default_course_id'));
            let course = storedId ? data.courses.find(c => c.id === String(storedId)) : null;
            if (!course) course = data.courses.find(c => /^default \d{6}$/.test(c.name));
            if (course) {
                selectCourse(course.id);
                return true;
            }
            return false;
        }

        function applyCourseParam() {
            const courseParam = new URLSearchParams(location.search).get('course');
            if (!courseParam) return;
            if (courseParam === 'default') {
                pendingDefaultSelect = !selectDefaultCourseIfExists();
            } else if (data.courses.some(c => c.id === courseParam)) {
                selectCourse(courseParam);
            }
        }

        async function loadCourses() {
            try {
                const res = await apiFetch('/api/courses');
                if (res.status === 401) {
                    showToast(t('loginExpired'), 'error');
                    return;
                }
                if (!res.ok) throw new Error('Failed to load courses');
                const result = await res.json();
                data.courses = (result.courses || []).map(c => ({ ...c, id: String(c.id) }));
                data.materials = [];
                data.questions = [];
                currentCourseId = null;
                renderCourseList();
                renderCourseDetail();
            } catch (e) {
                console.error(e);
                showToast(t('loadCoursesFailed'), 'error');
            }
        }

        async function loadCourseDetail(courseId) {
            try {
                const res = await apiFetch(`/api/courses/${courseId}`);
                if (!res.ok) throw new Error('Failed to load course detail');
                const result = await res.json();
                data.materials = (result.materials || []).map(m => ({ ...m, id: String(m.id), course_id: String(m.course_id) }));
                data.questions = (result.questions || []).map(q => ({ ...q, id: String(q.id), course_id: String(q.course_id), batch_id: q.batch_id ? String(q.batch_id) : null }));
                data.batches = (result.batches || []).map(b => ({ ...b, id: String(b.id), course_id: String(b.course_id) }));
                renderCourseDetail();
            } catch (e) {
                console.error(e);
                showToast(t('loadCourseDetailFailed'), 'error');
            }
        }

        function updateCourseCount(courseId, type, delta) {
            const course = data.courses.find(c => c.id === courseId);
            if (!course) return;
            if (type === 'materials') {
                course.material_count = Math.max(0, (course.material_count || 0) + delta);
            } else if (type === 'questions') {

            }

        // 可用 document-converter.js 浏览器端转 PDF 的 Office 格式
        const OFFICE_EXTS = ['docx', 'pptx', 'xlsx', 'xls'];
        let docConverter = null;

        function getDocConverter() {
            if (!docConverter) {
                docConverter = new DocumentConverter({
                    onProgress: (current, total, status) => console.log(`[Convert] ${current}/${total} - ${status}`)
                });
            }
            return docConverter;
        }

        async function convertOfficeToPdf(file) {
            const converter = getDocConverter();
            if (!converter.isFontLoaded) {
                showToast(t('loadingFont'), 'info');
                await converter.loadFont();
            }
            if (!converter.isFontLoaded || !converter.fontBytes) {
                throw new Error(t('fontLoadFailed'));
            }
            const blob = await converter.convert(file, { download: false });
            const pdfFileName = file.name.replace(/\.[^/.]+$/, '.pdf');
            return new File([blob], pdfFileName, { type: 'application/pdf' });
        }

        async function uploadFiles(files) {
            if (!currentCourseId) {
                showToast(t('selectCourseFirst'), 'error');
                return;
            }
            let successCount = 0;
            for (const file of Array.from(files)) {
                // Office 文件先在浏览器端转换为 PDF（与题库生成页同一套逻辑），再上传
                let uploadFile = file;
                const ext = (file.name.split('.').pop() || '').toLowerCase();
                if (OFFICE_EXTS.includes(ext)) {
                    try {
                        showToast(t('convertingToPdf', file.name), 'info');
                        uploadFile = await convertOfficeToPdf(file);
                    } catch (e) {
                        console.error(e);
                        showToast(t('convertFailed', file.name, e.message), 'error');
                        continue;
                    }
                }
                const form = new FormData();
                form.append('file', uploadFile);
                form.append('name', uploadFile.name);
                try {
                    const res = await apiFetch(`/api/courses/${currentCourseId}/materials`, {
                        method: 'POST',
                        body: form
                    });
                    if (!res.ok) throw new Error('Failed to upload material');
                    const result = await res.json();
                    result.material.id = String(result.material.id);
                    result.material.course_id = String(result.material.course_id);
                    data.materials.push(result.material);
                    successCount++;
                } catch (e) {
                    console.error(e);
                    showToast(t('uploadFailed', uploadFile.name), 'error');
                }
            }
            updateCourseCount(currentCourseId, 'materials', successCount);
            updateCountBadges();
            if (currentTab === 'materials') renderMaterials();
            if (successCount > 0) showToast(t('uploadedCount', successCount));
        }

        async function generateBanksForMaterials(materialIds, options) {
            if (isGenerating) return;
            isGenerating = true;
            setGenerateButtonsDisabled(true);

            const progressArea = document.getElementById('generateProgressArea');
            progressArea.classList.remove('hidden');
            progressArea.innerHTML = `<div class="text-sm text-slate-600 mb-2">${t('generating')}</div>`;

            const progressMap = new Map(); // fileId -> { status, count, total }

            // 先把所有待生成文件放入进度区，未轮到的显示「正在排队...」
            for (const id of materialIds) {
                const material = data.materials.find(m => m.id === String(id));
                progressMap.set(String(id), { name: material?.name || String(id), status: t('queued'), progress: 0, queued: true });
            }
            updateProgressUI();

            function updateProgressUI() {
                const items = Array.from(progressMap.values());
                if (items.length === 0) return;
                progressArea.innerHTML = items.map(item => `
                    <div class="p-3 rounded-xl bg-white/60 border border-white/80 text-sm">
                        <div class="flex items-center justify-between">
                            <span class="font-medium text-slate-700 truncate flex-1">${escapeHtml(item.name)}</span>
                            <span class="text-xs flex items-center gap-1.5 ${item.error ? 'text-red-500' : item.done ? 'text-emerald-600' : item.queued ? 'text-slate-400' : 'text-indigo-600'}">${item.parsing && !item.error && !item.done ? '<svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>' : ''}${item.status}</span>
                        </div>
                        ${!item.error && !item.done && !item.parsing && !item.queued ? `
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500 rounded-full transition-all" style="width: ${item.progress || 0}%"></div>
                        </div>` : ''}
                    </div>
                `).join('');
            }

            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}/generate-banks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        materialIds: materialIds.map(id => parseInt(id)),
                        questionCount: options.questionCount,
                        lang: options.lang,
                        turnstileToken: options.turnstileToken
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || t('requestFailed', res.status));
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let allDoneReceived = false;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const payload = line.slice(6).trim();
                        if (!payload || payload === '[DONE]') continue;
                        try {
                            const event = JSON.parse(payload);
                            const fileId = event.fileId ? String(event.fileId) : null;

                            if (fileId && !progressMap.has(fileId)) {
                                progressMap.set(fileId, { name: event.fileName || fileId, status: t('waiting'), progress: 0 });
                            }

                            if (event.type === 'file_start') {
                                const item = progressMap.get(fileId);
                                item.queued = false;
                                item.status = t('parsingFile');
                                item.parsing = true;
                            } else if (event.type === 'batch0_chunk') {
                                // 流式逐题更新进度（与 DocGenerate 一致）
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.chunkBuffer = (item.chunkBuffer || '') + (event.data || '');
                                const n = countCompleteQuestions(item.chunkBuffer);
                                if (n > (item.count || 0)) {
                                    item.count = n;
                                    item.status = t('generatedCount', n);
                                    // 流式阶段最多走到 89%，之后由 final_result / file_done 推进
                                    item.progress = Math.max(item.progress || 0, Math.min(89, Math.round(n / options.questionCount * 100)));
                                }
                            } else if (event.type === 'batch0_done' || event.type === 'batch_done') {
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.count = Math.max(event.count || 0, item.count || 0);
                                item.status = t('generatedCount', item.count);
                                item.progress = Math.max(item.progress || 0, 50);
                            } else if (event.type === 'final_result') {
                                const item = progressMap.get(fileId);
                                item.parsing = false;
                                item.count = event.generatedCount || event.data?.length || 0;
                                item.status = t('totalCount', item.count);
                                item.progress = Math.max(item.progress || 0, 90);
                            } else if (event.type === 'done') {
                                // 单个文件完成
                            } else if (event.type === 'file_done') {
                                const item = progressMap.get(fileId);
                                item.done = true;
                                item.status = t('saved');
                                item.progress = 100;
                                item.count = event.generatedCount || 0;

                                // 保存到本地并上传云端
                                await saveGeneratedBankToLocalAndCloud(event.fileId, event.fileName, event.questions, options.lang);
                            } else if (event.type === 'file_error') {
                                const item = progressMap.get(fileId);
                                item.error = true;
                                item.status = t('failedPrefix', friendlyGenerateError(event.message));
                            } else if (event.type === 'all_done') {
                                allDoneReceived = true;
                            } else if (event.type === 'error') {
                                throw new Error(friendlyGenerateError(event.message));
                            }
                            updateProgressUI();
                        } catch (e) {
                            console.error('Parse SSE error:', e, line);
                        }
                    }
                }

                showToast(t('generateComplete', Array.from(progressMap.values()).filter(i => i.done).length), 'success');
                selectedMaterialIds.clear();
                renderMaterials();
                // 重新拉取云题库，刷新「我的题目」数量徽标（当前在该标签页时也同步刷新列表）
                await loadCloudBanks();

        async function saveGeneratedBankToLocalAndCloud(materialId, materialName, questions, lang) {
            if (!Array.isArray(questions) || questions.length === 0) return;

            const bankName = t('bankNameSuffix', materialName);
            const bank = {
                name: bankName,
                questions: questions,
                favorites: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            // 1. 保存到本地 IndexedDB
            const localBankId = await db.questionBanks.add(bank);

            // 2. 下载源文件到本地 sourceFiles（如果 R2 有）
            const material = data.materials.find(m => m.id === String(materialId));
            if (material && material.r2_key) {
                try {
                    const res = await apiFetch(`/api/courses/${currentCourseId}/materials/${materialId}/download`);
                    if (res.ok) {
                        const blob = await res.blob();
                        await db.sourceFiles.add({
                            name: material.name,
                            fileName: material.name,
                            bankId: localBankId,
                            data: blob,
                            createdAt: new Date().toISOString()
                        });
                    }
                } catch (e) {
                    console.warn('Download source file to local failed:', e);
                }
            }

            // 3. 上传到云端 D1
            try {
                const res = await apiFetch('/api/cloud-banks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: bankName,
                        content: JSON.stringify(bank),
                        is_public: false,
                        course_id: currentCourseId,
                        source_r2_key: material?.r2_key || null,
                        source_name: material?.name || materialName,
                        source_type: material?.type || 'application/octet-stream',
                        source_size: material?.size || 0
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || t('requestFailed', res.status));
                }
                // 回写云端 id，避免被 BankMigration 当成待迁移的本地题库重复上云
                const uploaded = await res.json().catch(() => null);
                if (uploaded?.bank?.id) {
                    await db.questionBanks.update(localBankId, { migratedCloudId: uploaded.bank.id });
                }
            } catch (e) {
                console.warn('Upload bank to cloud failed:', e);
                showToast(t('savedLocalCloudFailed', bankName, e.message), 'error');
            }
        }

        // 下载云端题库到本地（forceRefresh 时原地刷新已有副本），返回本地题库 id
        async function downloadCloudBankToLocal(bankId, { forceRefresh = false } = {}) {
            const existing = await db.questionBanks.filter(b => b.migratedCloudId === bankId && !b.isSmartSession).last();
            if (existing && !forceRefresh) return existing.id;

            // 1. 下载题库 JSON
            const res = await apiFetch(`/api/share/${bankId}/download`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: '' })
            });
            if (!res.ok) throw new Error('Failed to download bank');
            const data = await res.json();
            const bankData = JSON.parse(data.content);

            // 2. 写入/刷新本地 IndexedDB（标记 migratedCloudId，避免被 BankMigration 当成待迁移的本地题库重复上云）
            let localBankId;
            if (existing) {
                await db.questionBanks.update(existing.id, {
                    name: bankData.name || data.title || t('defaultBankName'),
                    questions: bankData.questions || [],
                    favorites: bankData.favorites || [],
                    updatedAt: new Date().toISOString()
                });
                localBankId = existing.id;
            } else {
                localBankId = await db.questionBanks.add({
                    name: bankData.name || data.title || t('defaultBankName'),
                    questions: bankData.questions || [],
                    favorites: bankData.favorites || [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    migratedCloudId: bankId
                });

                // 3. 首次下载时同步源文件到 sourceFiles
                const bankMeta = cloudBanks.find(b => b.id === bankId);
                if (bankMeta && bankMeta.has_source_file) {
                    try {
                        const sourceRes = await apiFetch(`/api/cloud-banks/${bankId}/source-file`);
                        if (sourceRes.ok) {
                            const blob = await sourceRes.blob();
                            await db.sourceFiles.add({
                                name: bankMeta.source_name || 'source',
                                fileName: bankMeta.source_name || 'source',
                                bankId: localBankId,
                                data: blob,
                                createdAt: new Date().toISOString()
                            });
                        }
                    } catch (e) {
                        console.warn('Download source file failed:', e);
                    }
                }
            }
            return localBankId;
        }

        async function practiceCloudBank(bankId) {
            if (practicingBankIds.has(bankId)) return;
            const bankMeta = cloudBanks.find(b => b.id === bankId);
            const isMistakeBook = bankMeta && bankMeta.bank_type === 'mistake';
            try {
                practicingBankIds.add(bankId);
                setBankDownloading(bankId, true);

                if (!isMistakeBook) {
                    // 普通题库：本地已有副本则直接跳转，resume=1 继续上次进度
                    const existing = await db.questionBanks.filter(b => b.migratedCloudId === bankId && !b.isSmartSession).last();
                    if (existing) {
                        window.location.href = `practice.html?id=${existing.id}&resume=1`;
                        return;
                    }
                    showToast(t('downloadingBank'));
                } else {
                    // 错题本内容会持续更新，每次都从云端刷新
                    showToast(t('syncingMistakes'));
                }

                const localBankId = await downloadCloudBankToLocal(bankId, { forceRefresh: isMistakeBook });
                window.location.href = `practice.html?id=${localBankId}&resume=1`;
            } catch (e) {
                console.error(e);
                showToast(t('loadBankFailed', e.message), 'error');
            } finally {
                practicingBankIds.delete(bankId);
                setBankDownloading(bankId, false);
            }
        }

        // ==================== 掌握度指标（基于 SM-2 复习状态，0-100 分） ====================
        // 单题掌握度 m = 100 × (0.7×e^(-t/S) + 0.3×E)：R=e^(-t/S) 为遗忘曲线记忆保持率
        // （t=距上次复习天数，S=max(interval,0.5) 为记忆稳定性），E=(ef-1.3)/1.3 截断到 0..1 为熟练度；
        // 未练过的题计 0 分；整库按答错次数加权平均（错得越多权重越大，最高 2.5 倍）。
        // 分档：90+ 熟练 / 70+ 基本 / 40+ 待复习 / <40 薄弱
        async function updateMasteryBadge() {
            const badge = document.getElementById('masteryBadge');
            if (!badge) return;
            badge.classList.add('hidden');
            if (!currentCourseId) return;
            const sameCourse = b => String(b.course_id || '') === String(currentCourseId);
            const banks = cloudBanks.filter(b => sameCourse(b) && b.bank_type !== 'mistake' && b.bank_type !== 'srs');
            const totalQuestions = banks.reduce((sum, b) => sum + (b.questions_count || 0), 0);
            if (!totalQuestions) return;

            // 读取 srs 复习状态档案（含旧版错题本 srs 合并，与智能练题同一口径）
            const bankIds = new Set(banks.map(b => b.id));
            const srsMap = {};
            const srsBank = cloudBanks.find(b => sameCourse(b) && b.bank_type === 'srs');
            const book = cloudBanks.find(b => sameCourse(b) && b.bank_type === 'mistake');
            try {
                if (srsBank) Object.assign(srsMap, (await downloadCloudBankContent(srsBank.id)).srs || {});
                if (book) {
                    const bookData = await downloadCloudBankContent(book.id);
                    const legacy = bookData.srs || {};
                    for (const key of Object.keys(legacy)) if (!srsMap[key]) srsMap[key] = legacy[key];
                    for (const item of bookData.questions || []) {
                        const key = `${item.originCloudBankId}:${item.originQuestionId}`;
                        if (!srsMap[key]) {
                            const count = parseWrongCount(item);
                            srsMap[key] = { ef: 2.5 - (Math.min(count, 5) / 5) * 1.2, interval: 0, reps: 0, nextReview: 0, lastReviewed: 0, wrong: count };
                        } else if (!srsMap[key].wrong) {
                            srsMap[key].wrong = parseWrongCount(item);
                        }
                    }
                }
            } catch (e) {
                console.warn('updateMasteryBadge: failed to load srs profile', e);
                return;
            }

            const now = Date.now();
            let weightedSum = 0, weightTotal = 0, practiced = 0;
            for (const key of Object.keys(srsMap)) {
                const bankId = Number(key.split(':')[0]);
                if (!bankIds.has(bankId)) continue; // 只统计当前课程现存题库的题
                const s = srsMap[key];
                let m = 0;
                if (s.lastReviewed) {
                    const tDays = Math.max(0, (now - s.lastReviewed) / 86400000);
                    const S = Math.max(s.interval || 0, 0.5);
                    const R = Math.exp(-tDays / S);
                    const E = Math.min(1, Math.max(0, ((s.ef || 1.3) - 1.3) / 1.3));
                    m = 100 * (0.7 * R + 0.3 * E);
                }
                const w = 1 + Math.min(s.wrong || 0, 3) * 0.5;
                weightedSum += m * w;
                weightTotal += w;
                practiced++;
            }
            // 未练过的题：0 分、权重 1
            weightTotal += Math.max(0, totalQuestions - practiced);
            if (!weightTotal) return;
            const score = Math.round(weightedSum / weightTotal);

            const bands = [
                [90, 'masteryHigh', 'bg-emerald-100 text-emerald-700 border-emerald-200'],
                [70, 'masteryMid', 'bg-blue-100 text-blue-700 border-blue-200'],
                [40, 'masteryLow', 'bg-amber-100 text-amber-700 border-amber-200'],
                [0, 'masteryWeak', 'bg-red-100 text-red-700 border-red-200']
            ];
            const [, bandKey, cls] = bands.find(([min]) => score >= min);
            badge.className = `px-3 py-2 rounded-xl border text-sm font-semibold flex items-center gap-1.5 ${cls}`;
            badge.title = t(bandKey);
            badge.innerHTML = `<span>${t('mastery')}</span><span>${score}</span>`;
        }

        // ==================== 个性化推题（参考 quizzer 的 SM-2 间隔重复模型） ====================
        // 范围覆盖课程全部题库：复习状态存在课程级隐藏云端题库（bank_type='srs'，只存状态不存题），
        // 点击时现拼全课程题目。一期 18 题，新题:复习老题 = 9:9 配额混合、交替出现；
        // 老题不够补新题，新题做完后放宽比例允许全老题；
        // 答错/答对/精选/问Gemini 都会在 practice.html 侧回写 srs 状态，形成闭环
        const SESSION_SIZE = 18;
        const SESSION_REVIEW_MAX = 9; // 老题（有 srs 记录且到期）每场最多 9 道，积压也不超
        // 送分题：答错超过 2 次且 ef 低的题，在靠前位置插入乱码选项的简化版（相当于提示答案）
        const FREEBIE_WRONG_MIN = 3;
        const FREEBIE_EF_MAX = 2.0;

        function parseWrongCount(q) {
            const m = (q.source || '').match(/\[(\d+)-times mistake\]$/);
            return m ? parseInt(m[1]) : 0;
        }

        async function downloadCloudBankContent(bankId) {
            const res = await apiFetch(`/api/share/${bankId}/download`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: '' })
            });
            if (!res.ok) throw new Error('Failed to download bank content');
            return JSON.parse((await res.json()).content);
        }

        function gibberishOption() {
            const chars = 'abcdefghijklmnopqrstuvwxyz';
            const len = 6 + Math.floor(Math.random() * 10);
            let s = '';
            for (let i = 0; i < len; i++) s += (i && Math.random() < 0.15) ? ' ' : chars[Math.floor(Math.random() * 26)];
            return s;
        }

        // 生成送分题：保留正确答案，其余选项换成随机乱码（多选题保留全部正确选项）
        function makeFreebie(q) {
            const clone = { ...q, options: { ...q.options }, isFreebie: true };
            const correctLetters = String(q.correctAnswer || '').toUpperCase();
            for (const key of Object.keys(clone.options)) {
                if (!correctLetters.includes(key)) clone.options[key] = gibberishOption();
            }
            return clone;
        }

        // 智能练题：汇总全课程题库 + srs 复习状态档案，生成个性化练习
        async function smartPractice() {
            if (!currentCourseId) return;
            const sameCourse = b => String(b.course_id || '') === String(currentCourseId);
            const banks = cloudBanks.filter(b => sameCourse(b) && b.bank_type !== 'mistake' && b.bank_type !== 'srs');
            if (!banks.length) {
                showToast(t('noBanksForPractice'), 'error');
                return;
            }
            showToast(t('generatingPersonalized'));
            try {
                // 1. 读取 srs 复习状态档案（没有则视为全新）；兼容旧版：合并错题本 content 里的 srs 与答错次数
                const srsBank = cloudBanks.find(b => sameCourse(b) && b.bank_type === 'srs');
                const book = cloudBanks.find(b => sameCourse(b) && b.bank_type === 'mistake');
                const srsMap = {};
                if (srsBank) Object.assign(srsMap, (await downloadCloudBankContent(srsBank.id)).srs || {});
                if (book) {
                    const bookData = await downloadCloudBankContent(book.id);
                    const legacy = bookData.srs || {};
                    for (const key of Object.keys(legacy)) if (!srsMap[key]) srsMap[key] = legacy[key];
                    for (const item of bookData.questions || []) {
                        const key = `${item.originCloudBankId}:${item.originQuestionId}`;
                        const count = parseWrongCount(item);
                        if (!srsMap[key]) {
                            srsMap[key] = { ef: 2.5 - (Math.min(count, 5) / 5) * 1.2, interval: 0, reps: 0, nextReview: 0, lastReviewed: 0, wrong: count };
                        } else if (!srsMap[key].wrong) {
                            srsMap[key].wrong = count;
                        }
                    }
                }

                // 2. 现拼全课程题目（本地有镜像直接复用，没有则下载）
                const pool = [];
                for (const bank of banks) {
                    const localId = await downloadCloudBankToLocal(bank.id);
                    const local = await db.questionBanks.get(localId);
                    for (const q of (local.questions || [])) {
                        pool.push({ ...q, originCloudBankId: bank.id, originQuestionId: q.id });
                    }
                }
                if (!pool.length) {
                    showToast(t('emptyBankPool'), 'error');
                    return;
                }

                // 3. 分桶：新题（无 srs 记录）先洗牌随机；老题（有 srs 记录且到期）薄弱在前；未到期老题按到期时间就近
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                const now = Date.now();
                const fresh = [], reviews = [], notDue = [];
                for (const q of pool) {
                    const s = srsMap[`${q.originCloudBankId}:${q.originQuestionId}`];
                    if (!s) {
                        fresh.push({ q, ef: 2.5, wrong: 0 });
                    } else {
                        const item = { q, ef: s.ef, wrong: s.wrong || 0, nextReview: s.nextReview || 0 };
                        (!item.nextReview || now >= item.nextReview ? reviews : notDue).push(item);
                    }
                }
                reviews.sort((a, b) => a.ef !== b.ef ? a.ef - b.ef : b.wrong - a.wrong);
                notDue.sort((a, b) => a.nextReview - b.nextReview);

                // 4. 配额混合：新:老 = 9:9；老题不够补新题；新题做完后放宽，允许全是老题
                const oldTake = reviews.splice(0, SESSION_REVIEW_MAX);
                const newTake = fresh.splice(0, SESSION_SIZE - oldTake.length);
                let shortage = SESSION_SIZE - oldTake.length - newTake.length;
                if (shortage > 0) oldTake.push(...reviews.splice(0, shortage));
                shortage = SESSION_SIZE - oldTake.length - newTake.length;
                if (shortage > 0) oldTake.push(...notDue.splice(0, shortage));

                // 新老交替混排（新题打头，老题穿插其中，而不是堆在最前）
                const session = [];
                let ni = 0, oi = 0;
                while (ni < newTake.length || oi < oldTake.length) {
                    if (ni < newTake.length) session.push(newTake[ni++]);
                    if (oi < oldTake.length) session.push(oldTake[oi++]);
                }

                // 5. 送分题：老题中错得多的，在真题前约 3 题处插入简化版
                const questions = session.map(s => s.q);
                for (const s of session) {
                    if (s.wrong >= FREEBIE_WRONG_MIN && s.ef <= FREEBIE_EF_MAX) {
                        const realIdx = questions.indexOf(s.q);
                        questions.splice(Math.max(0, realIdx - 3), 0, makeFreebie(s.q));
                    }
                }
                // 重新编号，避免送分题与真题同 id 导致精选/提问串键
                questions.forEach((q, i) => { q.id = i + 1; });

                // 6. 生成一次性智能练习题库（挂在课程关联的 cloudId 下，练习结果回写 srs 与错题本）
                await db.questionBanks.filter(b => !!b.isSmartSession).delete();
                const courseName = (document.getElementById('currentCourseName').textContent || t('defaultCourseName')).trim();
                const localBankId = await db.questionBanks.add({
                    name: t('smartSessionName', courseName),
                    questions,
                    favorites: [],
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    migratedCloudId: srsBank ? srsBank.id : (book ? book.id : banks[0].id),
                    isSmartSession: true
                });
                window.location.href = `practice.html?id=${localBankId}`;
            } catch (e) {
                console.error(e);
                showToast(t('personalizedFailed', e.message), 'error');
            }
        }

        async function deleteCloudBank(bankId) {
            if (!confirm(t('confirmDeleteBank'))) return;
            try {
                const res = await apiFetch(`/api/cloud-banks/${bankId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete cloud bank');
                cloudBanks = cloudBanks.filter(b => b.id !== bankId);
                renderQuestions();
                showToast(t('bankDeleted'));
            } catch (e) {
                console.error(e);
                showToast(t('deleteBankFailed'), 'error');
            }
        }

        async function downloadCloudBankSource(bankId) {
            try {
                const bank = cloudBanks.find(b => b.id === bankId);
                const fileName = bank?.source_name || 'source';
                const res = await apiFetch(`/api/cloud-banks/${bankId}/source-file`);
                if (!res.ok) throw new Error('Failed to download source file');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
                showToast(t('downloadSourceFailed'), 'error');
            }
        }

        async function deleteQuestion(questionId) {
            if (!currentCourseId) {
                showToast(t('selectCourseFirst'), 'error');
                return;
            }
            if (!confirm(t('confirmDeleteQuestion'))) return;

            // 前端模拟生成的题目，直接本地删除，不调后端
            if (String(questionId).startsWith('mock_')) {
                data.questions = data.questions.filter(q => q.id !== questionId);
                updateCourseCount(currentCourseId, 'questions', -1);
                updateCountBadges();
                renderQuestions();
                showToast(t('questionDeleted'));
                return;
            }

            try {
                const res = await apiFetch(`/api/courses/${currentCourseId}/questions/${questionId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to delete question');
                data.questions = data.questions.filter(q => q.id !== questionId);
                updateCourseCount(currentCourseId, 'questions', -1);
                updateCountBadges();
                renderQuestions();
                showToast(t('questionDeleted'));
            } catch (e) {
                console.error(e);
                showToast(t('deleteQuestionFailed'), 'error');
            }
        }

        // 从教务系统导入课程（Moodle）
        function hideMoodleImportModal() {
            document.getElementById('moodleImportModal').classList.add('hidden');
        }

        async function importFromAcademicSystem() {
            const modal = document.getElementById('moodleImportModal');
            const container = document.getElementById('moodleCourseList');
            modal.classList.remove('hidden');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">${t('loadingCourses')}</div>`;

            try {
                const response = await apiFetch('/api/moodle/courses');
                const result = await response.json();

                if (!response.ok || result.error) {
                    throw new Error(result.error || t('requestFailed', response.status));
                }

                const courses = result.courses || [];
                if (courses.length === 0) {
                    container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">${t('noImportableCourses')}</div>`;
                    return;
                }

                container.innerHTML = `
                    <div class="text-xs text-slate-500 mb-2 px-1">${t('clickToImport')}</div>
                    ${courses.map(course => `
                        <div onclick="importMoodleCourse(${course.id}, ${JSON.stringify(course.fullname).replace(/"/g, '&quot;')})" 
                             class="p-3 rounded-xl bg-white/60 border border-white/80 hover:bg-emerald-50/50 cursor-pointer transition-colors group">
                            <div class="font-medium text-sm text-slate-900 group-hover:text-emerald-700">${escapeHtml(course.fullname)}</div>
                            <div class="text-xs text-slate-500 mt-1">ID: ${course.id} · ${escapeHtml(course.shortname || '')}</div>
                        </div>
                    `).join('')}
                `;
            } catch (err) {
                container.innerHTML = `<div class="text-center py-8 text-red-500 text-sm">${t('readFailed', escapeHtml(err.message))}</div>`;
            }
        }

        async function importMoodleCourse(moodleCourseId, courseName) {
            const container = document.getElementById('moodleCourseList');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">${t('importingCourse')}</div>`;

            try {
                const response = await apiFetch(`/api/moodle/courses/${moodleCourseId}/import`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (!response.ok || result.error) {
                    throw new Error(result.error || t('importFailedStatus', response.status));
                }

                // 导入成功，添加到本地课程列表
                const importedCourse = {
                    id: String(result.course.id),
                    name: result.course.name,
                    material_count: result.materials.length,
                    question_count: 0,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                data.courses.unshift(importedCourse);
                currentCourseId = importedCourse.id;
                renderCourseList();
                await loadCourseDetail(importedCourse.id);
                hideMoodleImportModal();
                hideAddCourseModal();
                showToast(t('importedCourse', result.course.name, result.materials.length));
            } catch (err) {
                container.innerHTML = `<div class="text-center py-8 text-red-500 text-sm">${t('importFailed', escapeHtml(err.message))}</div>`;
            }
        }

        document.getElementById('addCourseModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddCourseModal();
        });
        document.getElementById('addQuestionModal').addEventListener('click', function(e) {
            if (e.target === this) hideAddQuestionModal();
        });
        document.getElementById('generateBankModal').addEventListener('click', function(e) {
            if (e.target === this) hideGenerateBankModal();
        });
        document.getElementById('moodleImportModal').addEventListener('click', function(e) {
            if (e.target === this) hideMoodleImportModal();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
